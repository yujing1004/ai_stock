<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai_stock Verification</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">
    <div class="max-w-2xl w-full p-8 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-4xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
            {{ status }}
        </h1>
        <div class="space-y-4">
            <p class="text-slate-400">Your environment is ready for <strong>ai_stock</strong> development!</p>
            <div class="p-4 bg-slate-900 rounded-lg border border-slate-700 font-mono text-sm">
                {{ df_html | safe }}
            </div>
            <div class="mt-8 flex gap-4">
                <span class="px-3 py-1 bg-blue-500/10 text-blue-400 rounded-full text-xs font-semibold border border-blue-500/20">Flask</span>
                <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-500/20">Pandas</span>
                <span class="px-3 py-1 bg-amber-500/10 text-amber-400 rounded-full text-xs font-semibold border border-amber-500/20">yfinance</span>
                <span class="px-3 py-1 bg-indigo-500/10 text-indigo-400 rounded-full text-xs font-semibold border border-indigo-500/20">Tailwind CSS v4</span>
            </div>
        </div>
    </div>
</body>
</html>
